<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260">
  <defs>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
      .section { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
      .label { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; }
      .tiny { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
      .box-offline { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; rx: 18; }
      .box-runtime { fill: #ecfdf5; stroke: #16a34a; stroke-width: 2; rx: 18; }
      .box-data { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 18; }
      .box-deploy { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; rx: 18; }
      .box-external { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 18; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .note { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 12; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1800" height="1260" fill="#ffffff"/>
  <text x="900" y="46" text-anchor="middle" class="title">Smart Listings - detailed full architecture</text>

  <rect x="40" y="80" width="540" height="450" class="box-offline"/>
  <text x="60" y="115" class="section">OFFLINE preparation - author machine only</text>

  <rect x="70" y="145" width="150" height="72" class="card"/>
  <text x="145" y="172" text-anchor="middle" class="label">otodom.pl</text>
  <text x="145" y="193" text-anchor="middle" class="small">listing pages + payloads</text>

  <rect x="260" y="145" width="260" height="86" class="card"/>
  <text x="390" y="172" text-anchor="middle" class="label">pipeline/scrape.ts</text>
  <text x="390" y="193" text-anchor="middle" class="small">nationwide random page sampling</text>
  <text x="390" y="212" text-anchor="middle" class="small">balanced 54 sale + 54 rent</text>

  <rect x="70" y="270" width="190" height="80" class="card"/>
  <text x="165" y="298" text-anchor="middle" class="label">data/raw/otodom/*.json</text>
  <text x="165" y="319" text-anchor="middle" class="small">raw snapshots</text>

  <rect x="305" y="270" width="215" height="80" class="card"/>
  <text x="412" y="298" text-anchor="middle" class="label">pipeline/ingest.ts</text>
  <text x="412" y="319" text-anchor="middle" class="small">batch enrichment orchestrator</text>

  <rect x="70" y="390" width="215" height="96" class="card"/>
  <text x="177" y="417" text-anchor="middle" class="label">pipeline/normalize.ts</text>
  <text x="177" y="438" text-anchor="middle" class="small">deterministic parsing</text>
  <text x="177" y="457" text-anchor="middle" class="tiny">price, area, rooms, floor, location</text>

  <rect x="320" y="390" width="200" height="96" class="card"/>
  <text x="420" y="417" text-anchor="middle" class="label">claude.ts</text>
  <text x="420" y="438" text-anchor="middle" class="small">extractFromDescription</text>
  <text x="420" y="457" text-anchor="middle" class="small">summarizeListing</text>

  <rect x="610" y="80" width="630" height="450" class="box-runtime"/>
  <text x="630" y="115" class="section">RUNTIME application - browse works even without API key</text>

  <rect x="640" y="145" width="180" height="78" class="card"/>
  <text x="730" y="172" text-anchor="middle" class="label">Vue 3 SPA</text>
  <text x="730" y="193" text-anchor="middle" class="small">main.ts + App.vue</text>

  <rect x="850" y="145" width="170" height="78" class="card"/>
  <text x="935" y="172" text-anchor="middle" class="label">router.ts</text>
  <text x="935" y="193" text-anchor="middle" class="small">list + detail routes</text>

  <rect x="1050" y="145" width="160" height="78" class="card"/>
  <text x="1130" y="172" text-anchor="middle" class="label">api/client.ts</text>
  <text x="1130" y="193" text-anchor="middle" class="small">typed fetch wrappers</text>

  <rect x="640" y="255" width="250" height="96" class="card"/>
  <text x="765" y="282" text-anchor="middle" class="label">ListingsView.vue</text>
  <text x="765" y="303" text-anchor="middle" class="small">manual filters + AI mode</text>
  <text x="765" y="322" text-anchor="middle" class="tiny">URL as state, one filters object</text>

  <rect x="930" y="255" width="180" height="96" class="card"/>
  <text x="1020" y="282" text-anchor="middle" class="label">ChatSearch.vue</text>
  <text x="1020" y="303" text-anchor="middle" class="small">NL query box</text>
  <text x="1020" y="322" text-anchor="middle" class="tiny">POST parse-intent</text>

  <rect x="640" y="385" width="250" height="110" class="card"/>
  <text x="765" y="412" text-anchor="middle" class="label">Express 5 - index.ts</text>
  <text x="765" y="433" text-anchor="middle" class="small">JSON middleware</text>
  <text x="765" y="452" text-anchor="middle" class="small">/api routing + SPA fallback</text>
  <text x="765" y="471" text-anchor="middle" class="tiny">serveStatic in single-port mode</text>

  <rect x="930" y="385" width="140" height="110" class="card"/>
  <text x="1000" y="412" text-anchor="middle" class="label">routes/</text>
  <text x="1000" y="433" text-anchor="middle" class="small">listings.ts</text>
  <text x="1000" y="452" text-anchor="middle" class="small">search.ts</text>

  <rect x="1100" y="385" width="110" height="110" class="card"/>
  <text x="1155" y="422" text-anchor="middle" class="label">Zod</text>
  <text x="1155" y="443" text-anchor="middle" class="small">boundary</text>
  <text x="1155" y="462" text-anchor="middle" class="small">validation</text>

  <rect x="1270" y="80" width="490" height="450" class="box-data"/>
  <text x="1290" y="115" class="section">DATA layer</text>

  <rect x="1300" y="145" width="210" height="96" class="card"/>
  <text x="1405" y="172" text-anchor="middle" class="label">pipeline/seed.ts</text>
  <text x="1405" y="193" text-anchor="middle" class="small">upsert committed JSON</text>
  <text x="1405" y="212" text-anchor="middle" class="tiny">flag fuzzy duplicates</text>

  <rect x="1540" y="145" width="190" height="96" class="card"/>
  <text x="1635" y="172" text-anchor="middle" class="label">db.ts</text>
  <text x="1635" y="193" text-anchor="middle" class="small">createPool</text>
  <text x="1635" y="212" text-anchor="middle" class="tiny">ensureSchema() on boot</text>

  <rect x="1320" y="285" width="390" height="165" class="card"/>
  <text x="1515" y="316" text-anchor="middle" class="label">MySQL 8 - single listings table</text>
  <text x="1515" y="340" text-anchor="middle" class="small">columns for normalized listing + raw_json kept internal</text>
  <text x="1515" y="363" text-anchor="middle" class="small">indexes: offer_type, city, price, area_m2, dedupe_hash</text>
  <text x="1515" y="386" text-anchor="middle" class="small">UNIQUE (source, source_id)</text>
  <text x="1515" y="409" text-anchor="middle" class="tiny">collation utf8mb4_0900_ai_ci for case- and accent-insensitive search</text>

  <rect x="40" y="570" width="1720" height="280" class="box-deploy"/>
  <text x="60" y="605" class="section">BOOT / DEPLOY / PROCESS TOPOLOGY</text>

  <rect x="70" y="640" width="220" height="96" class="card"/>
  <text x="180" y="667" text-anchor="middle" class="label">docker compose up</text>
  <text x="180" y="688" text-anchor="middle" class="small">db + app</text>
  <text x="180" y="707" text-anchor="middle" class="tiny">localhost:3004</text>

  <rect x="330" y="640" width="220" height="96" class="card"/>
  <text x="440" y="667" text-anchor="middle" class="label">app container / process</text>
  <text x="440" y="688" text-anchor="middle" class="small">npm run seed &amp;&amp; server start</text>
  <text x="440" y="707" text-anchor="middle" class="tiny">Express serves API + built SPA</text>

  <rect x="590" y="640" width="220" height="96" class="card"/>
  <text x="700" y="667" text-anchor="middle" class="label">db container</text>
  <text x="700" y="688" text-anchor="middle" class="small">mysql:8.4</text>
  <text x="700" y="707" text-anchor="middle" class="tiny">healthcheck + volume</text>

  <rect x="860" y="640" width="250" height="96" class="card"/>
  <text x="985" y="667" text-anchor="middle" class="label">host-side dev mode</text>
  <text x="985" y="688" text-anchor="middle" class="small">npm run dev</text>
  <text x="985" y="707" text-anchor="middle" class="tiny">server tsx watch + Vite proxy</text>

  <rect x="1150" y="640" width="260" height="96" class="card"/>
  <text x="1280" y="667" text-anchor="middle" class="label">single-port prod/demo</text>
  <text x="1280" y="688" text-anchor="middle" class="small">browser hits one app port</text>
  <text x="1280" y="707" text-anchor="middle" class="tiny">API and SPA served together</text>

  <rect x="1450" y="640" width="280" height="96" class="card"/>
  <text x="1590" y="667" text-anchor="middle" class="label">optional AI dependency</text>
  <text x="1590" y="688" text-anchor="middle" class="small">missing ANTHROPIC_API_KEY disables chat semantics</text>
  <text x="1590" y="707" text-anchor="middle" class="tiny">browse/search still works</text>

  <rect x="40" y="890" width="1720" height="320" class="box-external"/>
  <text x="60" y="925" class="section">Cross-cutting rules and external integrations</text>

  <rect x="70" y="960" width="390" height="100" class="note"/>
  <text x="90" y="992" class="label">AI confinement</text>
  <text x="90" y="1015" class="small">Only claude.ts imports the Anthropic SDK.</text>
  <text x="90" y="1036" class="small">Deterministic code owns price, area, rooms, and floor parsing.</text>

  <rect x="500" y="960" width="390" height="100" class="note"/>
  <text x="520" y="992" class="label">Strict layering</text>
  <text x="520" y="1015" class="small">routes validate and shape HTTP responses.</text>
  <text x="520" y="1036" class="small">repo owns all SQL; routes never inline SQL.</text>

  <rect x="930" y="960" width="390" height="100" class="note"/>
  <text x="950" y="992" class="label">Nulls end to end</text>
  <text x="950" y="1015" class="small">Unknown values stay null in pipeline, DB, API, and UI.</text>
  <text x="950" y="1036" class="small">Missing data renders as "-", never fake zeroes.</text>

  <rect x="1360" y="960" width="370" height="100" class="note"/>
  <text x="1380" y="992" class="label">Shareable state</text>
  <text x="1380" y="1015" class="small">ListingsView syncs filters to URL.</text>
  <text x="1380" y="1036" class="small">AI mode also persists through mode=ai in the query string.</text>

  <rect x="70" y="1085" width="650" height="90" class="note"/>
  <text x="90" y="1118" class="label">Runtime request flow</text>
  <text x="90" y="1141" class="small">Browser � Vue views/components � api/client.ts � Express � routes � Zod � repo � MySQL</text>

  <rect x="770" y="1085" width="650" height="90" class="note"/>
  <text x="790" y="1118" class="label">AI request flow</text>
  <text x="790" y="1141" class="small">ChatSearch � /api/search/parse-intent � claude.ts � optional Anthropic API � filters JSON � same /api/listings path</text>

  <rect x="1460" y="1085" width="270" height="90" class="note"/>
  <text x="1480" y="1118" class="label">Data prep flow</text>
  <text x="1480" y="1141" class="small">scrape � raw JSON � ingest � normalize � enrich � listings.json � seed</text>

